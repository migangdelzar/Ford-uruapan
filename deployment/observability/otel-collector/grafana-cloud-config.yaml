extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  basicauth/grafana:
    client_auth:
      username: ${env:GRAFANA_CLOUD_INSTANCE_ID}
      password: ${env:GRAFANA_CLOUD_API_TOKEN}
  basicauth/langfuse:
    client_auth:
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: ford-service
          scrape_interval: 30s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: [ford-service:8080]

  file_log/docker:
    include:
      - /var/lib/docker/containers/*/*-json.log
    start_at: end
    include_file_path: true
    operators:
      - id: parse-docker-json
        type: json_parser
        parse_from: body
        parse_to: attributes
      - id: move-docker-log
        type: move
        from: attributes.log
        to: body
      - id: parse-docker-time
        type: time_parser
        parse_from: attributes.time
        layout: 2006-01-02T15:04:05.999999999Z07:00
        layout_type: gotime

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  attributes/redaction:
    actions:
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: gen_ai.prompt.0.content
        action: delete
      - key: gen_ai.completion.0.content
        action: delete
      - key: ford.customer.email
        action: delete
      - key: ford.customer.phone
        action: delete
      - key: ford.customer.name
        action: delete
      - key: ford.customer.curp
        action: delete
      - key: ford.finance.amount_mxn
        action: delete
      - key: ford.finance.income
        action: delete
      - key: provider.id
        action: delete
      - key: spring.ai.tool.call.arguments
        action: delete
      - key: spring.ai.tool.call.result
        action: delete
      - key: http.request.body
        action: delete
      - key: http.response.body
        action: delete
      - key: ford.raw_payload
        action: delete
  resource/ford:
    attributes:
      - key: service.name
        value: ford-service
        action: upsert
      - key: deployment.environment
        value: ${env:OTEL_DEPLOYMENT_ENVIRONMENT}
        action: upsert
  batch:
    timeout: 5s
    send_batch_size: 256

exporters:
  otlp_http/grafana:
    endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/grafana
    sending_queue:
      enabled: true
      queue_size: 512
    retry_on_failure:
      enabled: true
      max_elapsed_time: 30s
  otlp_http/langfuse:
    endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/langfuse
    sending_queue:
      enabled: true
      queue_size: 512
    retry_on_failure:
      enabled: true
      max_elapsed_time: 30s

service:
  extensions: [health_check, basicauth/grafana, basicauth/langfuse]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redaction, resource/ford, batch]
      exporters: [otlp_http/grafana, otlp_http/langfuse]
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, resource/ford, batch]
      exporters: [otlp_http/grafana]
    logs:
      receivers: [file_log/docker]
      processors: [memory_limiter, resource/ford, batch]
      exporters: [otlp_http/grafana]
