---
- name: Create Ollama runtime directory
  ansible.builtin.file:
    path: "{{ remote_root }}/ai-runtime"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0750"

- name: Require explicit approval before downloading the Ollama model
  ansible.builtin.assert:
    that:
      - ollama_model_pull_approved | default(false) | bool
    fail_msg: "Set ollama_model_pull_approved=true to download the approved Ollama model."
  when: ollama_model_pull | default(false) | bool

- name: Render Ollama runtime Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ remote_root }}/ai-runtime/compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"

- name: Start the Ollama runtime without downloading a model
  ansible.builtin.command:
    cmd: docker compose --project-name ford-ai-runtime -f "{{ remote_root }}/ai-runtime/compose.yml" up -d --wait ollama
  changed_when: true

- name: Download the approved Ollama model only when explicitly requested
  ansible.builtin.command:
    cmd: docker compose --project-name ford-ai-runtime -f "{{ remote_root }}/ai-runtime/compose.yml" run --rm ollama-model-pull
  when: ollama_model_pull | default(false) | bool
  changed_when: true
