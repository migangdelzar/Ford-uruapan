services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ford_service
      POSTGRES_USER: ford
      POSTGRES_PASSWORD: ford
    ports:
      - "5432:5432"
    volumes:
      - ford-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ford-service:
    build: .
    depends_on:
      - postgres
      - redis
    environment:
      FORD_DATABASE_URL: jdbc:postgresql://postgres:5432/ford_service
      FORD_DATABASE_USERNAME: ford
      FORD_DATABASE_PASSWORD: ${FORD_DATABASE_PASSWORD:-ford}
      FORD_SECURITY_JWT_ENABLED: ${FORD_SECURITY_JWT_ENABLED:-false}
      FORD_SECURITY_ISSUER_URI: ${FORD_SECURITY_ISSUER_URI:-}
      FORD_SECURITY_AUDIENCE: ${FORD_SECURITY_AUDIENCE:-ford-ai-service}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      FORD_META_APP_SECRET: ${FORD_META_APP_SECRET:-}
      FORD_META_VERIFY_TOKEN: ${FORD_META_VERIFY_TOKEN:-}
      FORD_META_AUTO_BINDING_ENABLED: ${FORD_META_AUTO_BINDING_ENABLED:-true}
      FORD_META_PROVIDER_ACCOUNT_ID: ${FORD_META_PROVIDER_ACCOUNT_ID:-${FORD_META_PHONE_ID:-}}
      FORD_META_PHONE_ID: ${FORD_META_PHONE_ID:-}
      FORD_META_DELIVERY_ENABLED: ${FORD_META_DELIVERY_ENABLED:-false}
      FORD_META_WHATSAPP_DELIVERY_ENDPOINT: ${FORD_META_WHATSAPP_DELIVERY_ENDPOINT:-}
      FORD_META_WHATSAPP_ACCESS_TOKEN: ${FORD_META_WHATSAPP_ACCESS_TOKEN:-}
      FORD_META_MESSENGER_DELIVERY_ENDPOINT: ${FORD_META_MESSENGER_DELIVERY_ENDPOINT:-}
      FORD_META_MESSENGER_ACCESS_TOKEN: ${FORD_META_MESSENGER_ACCESS_TOKEN:-}
      FORD_META_INSTAGRAM_DELIVERY_ENDPOINT: ${FORD_META_INSTAGRAM_DELIVERY_ENDPOINT:-}
      FORD_META_INSTAGRAM_ACCESS_TOKEN: ${FORD_META_INSTAGRAM_ACCESS_TOKEN:-}
      FORD_AI_LOCAL_BASE_URL: ${FORD_AI_LOCAL_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      FORD_AI_LOCAL_MODEL_VERSION: ${FORD_AI_LOCAL_MODEL_VERSION:-llama3.2}
      FORD_AI_EMBEDDING_MODEL_VERSION: ${FORD_AI_EMBEDDING_MODEL_VERSION:-nomic-embed-text}
      FORD_AI_CLOUD_BASE_URL: ${FORD_AI_CLOUD_BASE_URL:-https://api.openai.com/v1}
      FORD_AI_CLOUD_MODEL_VERSION: ${FORD_AI_CLOUD_MODEL_VERSION:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FORD_AI_CLOUD_ENABLED: ${FORD_AI_CLOUD_ENABLED:-false}
      FORD_AI_LOCAL_ENABLED: ${FORD_AI_LOCAL_ENABLED:-true}
      FORD_INGESTION_ENABLED: ${FORD_INGESTION_ENABLED:-false}
      FORD_TENANT_ID: ${FORD_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      FORD_CATALOG_ENDPOINT: ${FORD_CATALOG_ENDPOINT:-}
      FORD_INVENTORY_ENDPOINT: ${FORD_INVENTORY_ENDPOINT:-}
      FORD_SCRAPER_ENDPOINT: ${FORD_SCRAPER_ENDPOINT:-}
      FORD_MANUAL_CSV_PATH: ${FORD_MANUAL_CSV_PATH:-}
      FORD_OUTBOX_ENABLED: ${FORD_OUTBOX_ENABLED:-false}
      FORD_OTEL_TRACES_EXPORT_ENABLED: ${FORD_OTEL_TRACES_EXPORT_ENABLED:-false}
      FORD_OTEL_TRACES_ENDPOINT: ${FORD_OTEL_TRACES_ENDPOINT_DOCKER:-http://host.docker.internal:4318/v1/traces}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

volumes:
  ford-postgres:
