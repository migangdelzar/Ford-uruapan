spring:
  ai:
    chat:
      client:
        observations:
          log-prompt: false
          log-completion: false

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://127.0.0.1:1/v1/traces
