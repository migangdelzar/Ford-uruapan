spring:
  application:
    name: ford-service
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  modulith:
    runtime:
      verification-enabled: true
    events:
      republish-outstanding-events-on-restart: true
      completion-mode: update
      staleness:
        published: 10m
        processing: 10m
        resubmitted: 10m
        check-interval: 1m
      externalization:
        enabled: false
  datasource:
    url: ${FORD_DATABASE_URL:jdbc:postgresql://localhost:5432/ford_service}
    username: ${FORD_DATABASE_USERNAME:ford}
    password: ${FORD_DATABASE_PASSWORD:ford}
  data:
    redis:
      host: ${FORD_REDIS_HOST:localhost}
      port: ${FORD_REDIS_PORT:6379}
  security:
    user:
      name: ${FORD_OPERATOR_USERNAME:operator}
      password: ${FORD_OPERATOR_PASSWORD:}
      roles: ${FORD_OPERATOR_ROLES:OPERATOR}
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  ai:
    retry:
      max-attempts: ${FORD_AI_RETRY_MAX_ATTEMPTS:2}
    chat:
      client:
        observations:
          log-prompt: ${FORD_AI_LOG_PROMPT:false}
          log-completion: ${FORD_AI_LOG_COMPLETION:false}
    openai:
      max-retries: 0
      # Spring AI 2.x passes this value directly to the OpenAI-compatible SDK,
      # which appends /chat/completions. Keep the provider API version here.
      base-url: ${FORD_AI_CLOUD_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${FORD_AI_CLOUD_MODEL_VERSION:gpt-4o-mini}
          temperature: ${FORD_AI_CLOUD_TEMPERATURE:0.3}
          top-p: ${FORD_AI_CLOUD_TOP_P:0.9}
          max-tokens: ${FORD_AI_CLOUD_MAX_TOKENS:500}
          frequency-penalty: ${FORD_AI_CLOUD_FREQUENCY_PENALTY:0.1}
    typesafe:
      api-key: ${TYPESAFE_API_KEY:}
      timeout: ${FORD_AI_CLASSIFICATION_TIMEOUT_MS:1500}ms
    model:
      chat: ${FORD_AI_CHAT_PROVIDER:ollama}
      embedding: ${FORD_AI_EMBEDDING_PROVIDER:ollama}
    ollama:
      base-url: ${FORD_AI_LOCAL_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${FORD_AI_LOCAL_MODEL_VERSION:llama3.2}
          temperature: ${FORD_AI_LOCAL_TEMPERATURE:0.3}
          top-k: ${FORD_AI_LOCAL_TOP_K:40}
          top-p: ${FORD_AI_LOCAL_TOP_P:0.9}
          num-predict: ${FORD_AI_LOCAL_MAX_TOKENS:500}
      embedding:
        options:
          model: ${FORD_AI_EMBEDDING_MODEL_VERSION:nomic-embed-text}
    mcp:
      client:
        enabled: ${FORD_MCP_ENABLED:false}
        name: ford-advisor
        version: 1.0.0
        initialized: true
        type: SYNC
        request-timeout: ${FORD_MCP_REQUEST_TIMEOUT:30s}
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            ford-uruapan:
              url: ${FORD_MCP_URL:http://127.0.0.1:3001}
              endpoint: ${FORD_MCP_ENDPOINT:/mcp}
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
      - org.springaicommunity.typesafe.autoconfigure.TypeSafeAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

logging:
  level:
    root: INFO
    com.ford.service: INFO
    org.springframework: WARN
    org.springframework.boot: INFO
    org.springframework.modulith: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.springframework.jdbc: WARN
    org.springframework.data: WARN
    com.zaxxer.hikari: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
  pattern:
    correlation: "[trace_id=%X{traceId:-},span_id=%X{spanId:-}] "

ford:
  mcp:
    enabled: ${FORD_MCP_ENABLED:false}
    url: ${FORD_MCP_URL:http://127.0.0.1:3001}
    endpoint: ${FORD_MCP_ENDPOINT:/mcp}
    token: ${FORD_MCP_TOKEN:}
    request-timeout: ${FORD_MCP_REQUEST_TIMEOUT:30s}
    required-for-volatile-information: ${FORD_MCP_REQUIRED_FOR_VOLATILE_INFORMATION:true}
    read-only-tool-names: ${FORD_MCP_READ_ONLY_TOOL_NAMES:search_vehicles,get_vehicle,compare_vehicles,search_offers,list_promotions,get_vehicle_provenance,get_catalog_status}
  security:
    jwt:
      enabled: ${FORD_SECURITY_JWT_ENABLED:false}
      issuer-uri: ${FORD_SECURITY_ISSUER_URI:}
      audience: ${FORD_SECURITY_AUDIENCE:ford-ai-service}
  conversations:
    workflow:
      graph-enabled: ${FORD_CONVERSATION_GRAPH_ENABLED:true}
    human-handoff:
      enabled: ${FORD_HUMAN_HANDOFF_ENABLED:false}
  memory:
    enabled: ${FORD_MEMORY_ENABLED:true}
    recent-message-limit: ${FORD_MEMORY_RECENT_MESSAGE_LIMIT:20}
    prompt-recent-message-limit: ${FORD_MEMORY_PROMPT_RECENT_MESSAGE_LIMIT:8}
    summary-max-chars: ${FORD_MEMORY_SUMMARY_MAX_CHARS:4000}
    fact-limit: ${FORD_MEMORY_FACT_LIMIT:12}
    fact-max-chars: ${FORD_MEMORY_FACT_MAX_CHARS:500}
    semantic-enabled: ${FORD_MEMORY_SEMANTIC_ENABLED:false}
    semantic-limit: ${FORD_MEMORY_SEMANTIC_LIMIT:5}
    semantic-recall-enabled: ${FORD_MEMORY_SEMANTIC_RECALL_ENABLED:false}
    semantic-recall-limit: ${FORD_MEMORY_SEMANTIC_RECALL_LIMIT:3}
    semantic-recall-minimum-similarity: ${FORD_MEMORY_SEMANTIC_RECALL_MINIMUM_SIMILARITY:0.78}
    semantic-embedding-model: ${FORD_MEMORY_SEMANTIC_EMBEDDING_MODEL:${FORD_AI_EMBEDDING_MODEL_VERSION:nomic-embed-text}}
    cache-enabled: ${FORD_MEMORY_CACHE_ENABLED:true}
    cache-ttl: ${FORD_MEMORY_CACHE_TTL:PT24H}
    working-memory-ttl: ${FORD_MEMORY_WORKING_TTL:P90D}
  ingestion:
    enabled: ${FORD_INGESTION_ENABLED:false}
    tenant-id: ${FORD_TENANT_ID:00000000-0000-0000-0000-000000000001}
    cron: ${FORD_INGESTION_CRON:0 0 * * * *}
    catalog-endpoint: ${FORD_CATALOG_ENDPOINT:}
    inventory-endpoint: ${FORD_INVENTORY_ENDPOINT:}
    scraper-endpoint: ${FORD_SCRAPER_ENDPOINT:}
    manual-csv-path: ${FORD_MANUAL_CSV_PATH:}
    max-attempts: ${FORD_INGESTION_MAX_ATTEMPTS:3}
  channels:
    meta:
      app-secret: ${FORD_META_APP_SECRET:}
      verify-token: ${FORD_META_VERIFY_TOKEN:}
      auto-binding:
        enabled: ${FORD_META_AUTO_BINDING_ENABLED:false}
        provider-account-id: ${FORD_META_PROVIDER_ACCOUNT_ID:${FORD_META_PHONE_ID:}}
        tenant-id: ${FORD_TENANT_ID:00000000-0000-0000-0000-000000000001}
      delivery:
        enabled: ${FORD_META_DELIVERY_ENABLED:false}
        whatsapp-endpoint: ${FORD_META_WHATSAPP_DELIVERY_ENDPOINT:}
        whatsapp-access-token: ${FORD_META_WHATSAPP_ACCESS_TOKEN:}
        messenger-endpoint: ${FORD_META_MESSENGER_DELIVERY_ENDPOINT:}
        messenger-access-token: ${FORD_META_MESSENGER_ACCESS_TOKEN:}
        instagram-endpoint: ${FORD_META_INSTAGRAM_DELIVERY_ENDPOINT:}
        instagram-access-token: ${FORD_META_INSTAGRAM_ACCESS_TOKEN:}
  outbox:
    enabled: ${FORD_OUTBOX_ENABLED:false}
    fixed-delay-ms: ${FORD_OUTBOX_FIXED_DELAY_MS:1000}
    recovery-delay-ms: ${FORD_OUTBOX_RECOVERY_DELAY_MS:5000}
    max-attempts: ${FORD_OUTBOX_MAX_ATTEMPTS:5}
    lease-seconds: ${FORD_OUTBOX_LEASE_SECONDS:30}
    backoff-base-seconds: ${FORD_OUTBOX_BACKOFF_BASE_SECONDS:2}
    backoff-max-seconds: ${FORD_OUTBOX_BACKOFF_MAX_SECONDS:300}
  ai:
    cloud-chat-provider: ${FORD_AI_CLOUD_PROVIDER:openai}
    local-chat-provider: ${FORD_AI_LOCAL_PROVIDER:ollama}
    cloud-chat-model-version: ${FORD_AI_CLOUD_MODEL_VERSION:configured-cloud-model}
    local-chat-model-version: ${FORD_AI_LOCAL_MODEL_VERSION:configured-local-model}
    embedding-provider: ${FORD_AI_EMBEDDING_PROVIDER:ollama}
    embedding-model-version: ${FORD_AI_EMBEDDING_MODEL_VERSION:configured-embedding-model}
    cloud-enabled: ${FORD_AI_CLOUD_ENABLED:false}
    local-enabled: ${FORD_AI_LOCAL_ENABLED:true}
    log-provider-errors: ${FORD_AI_LOG_PROVIDER_ERRORS:false}
    provider-max-attempts: ${FORD_AI_PROVIDER_MAX_ATTEMPTS:2}
    provider-max-retry-after: ${FORD_AI_PROVIDER_MAX_RETRY_AFTER:PT3S}
    classification:
      enabled: ${FORD_AI_CLASSIFICATION_ENABLED:true}
      mode: ${FORD_AI_CLASSIFICATION_MODE:active}
      provider: ${FORD_AI_CLASSIFICATION_PROVIDER:typesafe}
      timeout-ms: ${FORD_AI_CLASSIFICATION_TIMEOUT_MS:1500}
      min-confidence: ${FORD_AI_CLASSIFICATION_MIN_CONFIDENCE:0.70}
      fallback: ${FORD_AI_CLASSIFICATION_FALLBACK:rules}
      pii-policy: ${FORD_AI_CLASSIFICATION_PII_POLICY:redact}
      intent-enabled: ${FORD_AI_CLASSIFIER_INTENT_ENABLED:true}
      lead-enabled: ${FORD_AI_CLASSIFIER_LEAD_ENABLED:true}
      handoff-enabled: ${FORD_AI_CLASSIFIER_HANDOFF_ENABLED:false}
      tools-enabled: ${FORD_AI_CLASSIFIER_TOOLS_ENABLED:true}
      sensitive-data-enabled: ${FORD_AI_CLASSIFIER_SENSITIVE_DATA_ENABLED:true}
      guardrails-enabled: ${FORD_AI_GUARDRAILS_ENABLED:false}
      self-refine-enabled: ${FORD_AI_SELF_REFINE_ENABLED:false}
      self-refine-max-attempts: ${FORD_AI_SELF_REFINE_MAX_ATTEMPTS:1}
  testlab:
    enabled: ${FORD_TESTLAB_ENABLED:false}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        enabled: ${FORD_OTEL_METRICS_EXPORT_ENABLED:false}
  tracing:
    export:
      enabled: ${FORD_OTEL_TRACES_EXPORT_ENABLED:false}
    sampling:
      probability: ${FORD_OTEL_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${FORD_OTEL_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
