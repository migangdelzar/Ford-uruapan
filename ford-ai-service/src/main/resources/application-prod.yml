spring:
  config:
    activate:
      on-profile: prod

ford:
  security:
    jwt:
      enabled: ${FORD_SECURITY_JWT_ENABLED:true}
    auth:
      enabled: ${FORD_SECURITY_AUTH_ENABLED:true}
      csrf-cookie-secure: ${FORD_SECURITY_COOKIE_SECURE:true}
  conversations:
    workflow:
      graph-enabled: ${FORD_CONVERSATION_GRAPH_ENABLED:true}
    human-handoff:
      enabled: ${FORD_HUMAN_HANDOFF_ENABLED:false}
  ai:
    classification:
      enabled: ${FORD_AI_CLASSIFICATION_ENABLED:true}
  channels:
    meta:
      auto-binding:
        enabled: ${FORD_META_AUTO_BINDING_ENABLED:false}
