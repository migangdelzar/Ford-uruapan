databaseChangeLog:
  - changeSet:
      id: 031-conversation-decision-events
      author: ford-service
      changes:
        - sql:
            sql: |
              create table conversation_decision_event (
                  tenant_id uuid not null,
                  conversation_id uuid not null,
                  receipt_id uuid not null,
                  event_sequence integer not null check (event_sequence >= 0),
                  stage varchar(20) not null check (stage in ('classifier','route','tool','answer','quality','handoff')),
                  reason_code varchar(64) not null,
                  route varchar(80),
                  model_role varchar(20) check (model_role is null or model_role in ('classifier','answer','none')),
                  tool_name varchar(80),
                  outcome varchar(20) not null check (outcome in
                      ('started','completed','skipped','returned','empty','failed','fallback','requested','queued')),
                  evidence_count integer check (evidence_count is null or evidence_count between 0 and 100000),
                  occurred_at timestamp with time zone not null,
                  primary key (tenant_id, conversation_id, receipt_id, event_sequence),
                  constraint conversation_decision_event_turn_fk foreign key
                      (tenant_id, conversation_id, receipt_id)
                      references conversation_turn(tenant_id, conversation_id, receipt_id)
                      on delete cascade
              );
              create index idx_conversation_decision_event_order
                  on conversation_decision_event(tenant_id, conversation_id, receipt_id, event_sequence);
      rollback:
        - sql:
            sql: |
              drop index if exists idx_conversation_decision_event_order;
              drop table if exists conversation_decision_event;
