databaseChangeLog:
  - changeSet:
      id: 012-lead-journey
      author: ford-service
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              create table lead_journey (
                  tenant_id uuid not null,
                  conversation_id uuid primary key references conversation(id) on delete cascade,
                  lead_id uuid references lead(id) on delete set null,
                  current_topic varchar(40),
                  visited_topics jsonb not null default '[]'::jsonb,
                  paused_topics jsonb not null default '[]'::jsonb,
                  facts jsonb not null default '{}'::jsonb,
                  pending_question_key varchar(80),
                  pending_question_attempts integer not null default 0 check (pending_question_attempts >= 0),
                  last_processed_message_id varchar(200),
                  version bigint not null default 0 check (version >= 0),
                  updated_at timestamptz not null,
                  constraint ck_lead_journey_topic check (
                      current_topic is null or current_topic in (
                          'VEHICLE_DISCOVERY', 'PROMOTIONS_PRICING',
                          'FINANCING_TRADE_IN', 'TEST_DRIVE_APPOINTMENT'
                      )
                  ),
                  unique (tenant_id, conversation_id)
              );
              create index idx_lead_journey_tenant_topic
                  on lead_journey(tenant_id, current_topic, updated_at desc);
      rollback:
        - sql:
            sql: drop table if exists lead_journey;
