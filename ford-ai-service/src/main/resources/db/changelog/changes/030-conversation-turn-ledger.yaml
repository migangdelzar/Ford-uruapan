databaseChangeLog:
  - changeSet:
      id: 030-conversation-turn-ledger
      author: ford-service
      changes:
        - sql:
            sql: |
              create table conversation_turn (
                  tenant_id uuid not null,
                  conversation_id uuid not null,
                  receipt_id uuid not null,
                  provider_message_id varchar(240) not null,
                  state varchar(32) not null,
                  attempt_count integer not null default 0 check (attempt_count >= 0),
                  failure_category varchar(80),
                  accepted_at timestamp with time zone not null,
                  updated_at timestamp with time zone not null,
                  next_attempt_at timestamp with time zone,
                  version bigint not null default 0 check (version >= 0),
                  primary key (tenant_id, conversation_id, receipt_id),
                  unique (tenant_id, conversation_id, provider_message_id),
                  constraint conversation_turn_state_check check (state in (
                      'ACCEPTED', 'DEBOUNCED', 'PROCESSING', 'RETRY_WAIT', 'REPLY_COMMITTED',
                      'SAFE_FALLBACK_REVIEW', 'HUMAN_PENDING', 'DELIVERY_PENDING', 'DELIVERED',
                      'DELIVERY_FAILED', 'NEEDS_OPERATOR', 'DUPLICATE', 'OUT_OF_SCOPE', 'SHADOW_DRAFT'
                  ))
              );
              create index idx_conversation_turn_due
                  on conversation_turn(tenant_id, state, next_attempt_at, accepted_at);

              create table conversation_review_item (
                  id uuid primary key,
                  tenant_id uuid not null,
                  conversation_id uuid not null,
                  receipt_id uuid not null,
                  reason_code varchar(80) not null,
                  status varchar(20) not null default 'PENDING',
                  created_at timestamp with time zone not null,
                  updated_at timestamp with time zone not null,
                  reviewed_by uuid,
                  reviewed_at timestamp with time zone,
                  unique (tenant_id, conversation_id, receipt_id),
                  constraint conversation_review_status_check check (status in (
                      'PENDING', 'IN_PROGRESS', 'RESOLVED'
                  )),
                  constraint conversation_review_turn_fk foreign key
                      (tenant_id, conversation_id, receipt_id)
                      references conversation_turn(tenant_id, conversation_id, receipt_id)
                      on delete cascade
              );
              create index idx_conversation_review_queue
                  on conversation_review_item(tenant_id, status, created_at);
      rollback:
        - sql:
            sql: |
              drop table if exists conversation_review_item;
              drop table if exists conversation_turn;
