databaseChangeLog:
  - changeSet:
      id: 002-channel-delivery
      author: ford-service
      changes:
        - sql:
            sql: |
              create table if not exists channel_delivery (
                  id bigserial primary key,
                  tenant_id uuid not null,
                  channel varchar(30) not null,
                  provider_message_id varchar(200) not null,
                  received_at timestamptz not null,
                  raw_payload_reference varchar(240) not null,
                  unique (tenant_id, channel, provider_message_id)
              );
              create index if not exists idx_channel_delivery_received on channel_delivery(tenant_id, received_at);
      rollback:
        - sql:
            sql: drop table if exists channel_delivery;
