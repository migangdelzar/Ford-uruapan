databaseChangeLog:
  - changeSet:
      id: 021-spring-auth-storage
      author: ford-service
      changes:
        - sql:
            sql: |
              create table user_entities (
                  id varchar(1000) primary key,
                  name varchar(100) not null,
                  display_name varchar(200)
              );
              create table user_credentials (
                  credential_id varchar(1000) primary key,
                  user_entity_user_id varchar(1000) not null,
                  public_key bytea not null,
                  signature_count bigint,
                  uv_initialized boolean,
                  backup_eligible boolean not null,
                  authenticator_transports varchar(1000),
                  public_key_credential_type varchar(100),
                  backup_state boolean not null,
                  attestation_object bytea,
                  attestation_client_data_json bytea,
                  created timestamptz,
                  last_used timestamptz,
                  label varchar(1000) not null
              );
              create index idx_user_credentials_entity on user_credentials (user_entity_user_id);
              create table one_time_tokens (
                  token_value varchar(36) primary key,
                  username varchar(320) not null,
                  expires_at timestamptz not null
              );
              create index idx_one_time_tokens_expiry on one_time_tokens (expires_at);
              create table oauth2_registered_client (
                  id varchar(100) primary key,
                  client_id varchar(100) not null unique,
                  client_id_issued_at timestamptz not null default current_timestamp,
                  client_secret varchar(200),
                  client_secret_expires_at timestamptz,
                  client_name varchar(200) not null,
                  client_authentication_methods varchar(1000) not null,
                  authorization_grant_types varchar(1000) not null,
                  redirect_uris varchar(1000),
                  post_logout_redirect_uris varchar(1000),
                  scopes varchar(1000) not null,
                  client_settings varchar(2000) not null,
                  token_settings varchar(2000) not null
              );
              create table oauth2_authorization (
                  id varchar(100) primary key,
                  registered_client_id varchar(100) not null,
                  principal_name varchar(200) not null,
                  authorization_grant_type varchar(100) not null,
                  authorized_scopes varchar(1000),
                  attributes text,
                  state varchar(500),
                  authorization_code_value text,
                  authorization_code_issued_at timestamptz,
                  authorization_code_expires_at timestamptz,
                  authorization_code_metadata text,
                  access_token_value text,
                  access_token_issued_at timestamptz,
                  access_token_expires_at timestamptz,
                  access_token_metadata text,
                  access_token_type varchar(100),
                  access_token_scopes varchar(1000),
                  oidc_id_token_value text,
                  oidc_id_token_issued_at timestamptz,
                  oidc_id_token_expires_at timestamptz,
                  oidc_id_token_metadata text,
                  refresh_token_value text,
                  refresh_token_issued_at timestamptz,
                  refresh_token_expires_at timestamptz,
                  refresh_token_metadata text,
                  user_code_value text,
                  user_code_issued_at timestamptz,
                  user_code_expires_at timestamptz,
                  user_code_metadata text,
                  device_code_value text,
                  device_code_issued_at timestamptz,
                  device_code_expires_at timestamptz,
                  device_code_metadata text
              );
              create index idx_oauth2_authorization_client on oauth2_authorization (registered_client_id);
              create index idx_oauth2_authorization_principal on oauth2_authorization (principal_name);
              create table oauth2_authorization_consent (
                  registered_client_id varchar(100) not null,
                  principal_name varchar(200) not null,
                  authorities varchar(1000) not null,
                  primary key (registered_client_id, principal_name)
              );
      rollback:
        - sql:
            sql: |
              drop table if exists oauth2_authorization_consent;
              drop table if exists oauth2_authorization;
              drop table if exists oauth2_registered_client;
              drop table if exists one_time_tokens;
              drop table if exists user_credentials;
              drop table if exists user_entities;
