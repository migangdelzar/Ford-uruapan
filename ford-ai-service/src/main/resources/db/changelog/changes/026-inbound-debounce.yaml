databaseChangeLog:
  - changeSet:
      id: 026-inbound-debounce
      author: ford-service
      changes:
        - sql:
            sql: |
              create table if not exists inbound_debounce (
                  tenant_id uuid not null,
                  conversation_id uuid not null,
                  receipt_id uuid not null,
                  channel varchar(32) not null,
                  provider_message_id varchar(200) not null,
                  accepted_at timestamptz not null,
                  due_at timestamptz not null,
                  updated_at timestamptz not null,
                  primary key (tenant_id, conversation_id)
              );
              create index if not exists idx_inbound_debounce_due_at
                  on inbound_debounce(due_at);
      rollback:
        - sql:
            sql: drop table if exists inbound_debounce;
