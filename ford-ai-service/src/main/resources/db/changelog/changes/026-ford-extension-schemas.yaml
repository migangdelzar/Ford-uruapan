databaseChangeLog:
  - changeSet:
      id: 026-ford-extension-schemas
      author: ford-service
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              create schema if not exists ford_catalog;

              do $$
              declare
                  extension_name text;
                  extension_schema text;
                  extension_relocatable boolean;
                  public_object_count integer;
              begin
                  foreach extension_name in array array['vector', 'pg_trgm'] loop
                      if not exists (select 1 from pg_extension where extname = extension_name) then
                          execute format('create extension %I with schema ford_catalog', extension_name);
                      else
                          select n.nspname, e.extrelocatable
                            into extension_schema, extension_relocatable
                          from pg_extension e
                          join pg_namespace n on n.oid = e.extnamespace
                          where e.extname = extension_name;

                          if extension_schema <> 'ford_catalog' then
                              if not extension_relocatable then
                                  raise exception 'Extension % is not relocatable', extension_name;
                              end if;
                              execute format('alter extension %I set schema ford_catalog', extension_name);
                          end if;
                      end if;
                  end loop;

                  select (
                      (select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public') +
                      (select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public') +
                      (select count(*) from pg_type t join pg_namespace n on n.oid = t.typnamespace where n.nspname = 'public') +
                      (select count(*) from pg_operator o join pg_namespace n on n.oid = o.oprnamespace where n.nspname = 'public') +
                      (select count(*) from pg_opclass o join pg_namespace n on n.oid = o.opcnamespace where n.nspname = 'public') +
                      (select count(*) from pg_opfamily o join pg_namespace n on n.oid = o.opfnamespace where n.nspname = 'public') +
                      (select count(*) from pg_collation c join pg_namespace n on n.oid = c.collnamespace where n.nspname = 'public') +
                      (select count(*) from pg_conversion c join pg_namespace n on n.oid = c.connamespace where n.nspname = 'public')
                  ) into public_object_count;

                  if public_object_count <> 0 then
                      raise exception 'Unreviewed objects remain in public schema (% objects)', public_object_count;
                  end if;
              end;
              $$;
