databaseChangeLog:
  - changeSet:
      id: 034-alternate-contact-forget-fence
      author: ford-service
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              create table if not exists handoff_contact_forget_fence (
                  tenant_id uuid not null,
                  conversation_id uuid not null,
                  forgotten_at timestamptz not null,
                  primary key (tenant_id, conversation_id)
              );
