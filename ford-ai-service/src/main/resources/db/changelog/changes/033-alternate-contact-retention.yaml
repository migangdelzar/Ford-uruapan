databaseChangeLog:
  - changeSet:
      id: 033-alternate-contact-retention
      author: ford-service
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              create table if not exists handoff_contact_staging (
                  tenant_id uuid not null,
                  conversation_id uuid not null,
                  receipt_id uuid not null,
                  ciphertext bytea not null,
                  nonce bytea not null,
                  key_version integer not null,
                  collected_at timestamptz not null,
                  expires_at timestamptz not null,
                  primary key (tenant_id, conversation_id, receipt_id),
                  check (octet_length(nonce) = 12),
                  check (key_version > 0),
                  check (expires_at <= collected_at + interval '24 hours')
              );
              create index if not exists idx_handoff_contact_staging_expiry
                  on handoff_contact_staging(expires_at);
