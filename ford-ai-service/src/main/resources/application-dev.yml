spring:
  config:
    activate:
      on-profile: dev

ford:
  conversations:
    human-handoff:
      enabled: ${FORD_HUMAN_HANDOFF_ENABLED:true}
  ai:
    classification:
      enabled: ${FORD_AI_CLASSIFICATION_ENABLED:true}
  channels:
    meta:
      auto-binding:
        enabled: ${FORD_META_AUTO_BINDING_ENABLED:true}
