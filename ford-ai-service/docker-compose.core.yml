services:
  catalog-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ford_catalog
      POSTGRES_USER: ${FORD_CATALOG_ADMIN_USERNAME:-ford_catalog_admin}
      POSTGRES_PASSWORD: ${FORD_CATALOG_ADMIN_PASSWORD:?local catalog admin password is required}
    ports:
      - "127.0.0.1:${FORD_CATALOG_PORT:-55433}:5432"
    volumes:
      - ford-catalog-postgres:/var/lib/postgresql/data

  ford-service:
    depends_on: !override
      - postgres
      - redis
      - catalog-postgres
    environment:
      FORD_CATALOG_TOOLS_ENABLED: ${FORD_CATALOG_TOOLS_ENABLED:-false}
      FORD_CATALOG_JDBC_URL: jdbc:postgresql://catalog-postgres:5432/ford_catalog
      FORD_CATALOG_USERNAME: ${FORD_CATALOG_USERNAME:-ford_catalog_reader}
      FORD_CATALOG_PASSWORD: ${FORD_CATALOG_PASSWORD:-}
      FORD_OTEL_TRACES_EXPORT_ENABLED: "false"
      FORD_OTEL_METRICS_EXPORT_ENABLED: "false"

volumes:
  ford-catalog-postgres:
