  /webhooks/meta/{channel}:
    get:
      tags: [Meta webhooks]
      summary: Verify a Meta webhook subscription
      description: Provider callback. This route is not a frontend browser API.
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/MetaChannel'
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
            enum: [subscribe]
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Challenge echoed as plain text
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Invalid verification request
    post:
      tags: [Meta webhooks]
      summary: Receive a Meta webhook delivery
      description: Provider callback authenticated by X-Hub-Signature-256. Do not call from the browser.
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/MetaChannel'
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
            pattern: '^sha256=[a-f0-9]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Webhook accepted for processing
        '400':
          description: Invalid payload or unsupported channel
        '403':
          description: Invalid signature or channel binding

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT must contain the configured audience, tenant_id or tenant_ids,
        a role such as OPERATOR/MANAGER/ADMIN, and the operation scope needed
        by the endpoint.
    operatorSessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Opaque HttpOnly Spring Session cookie. Unsafe requests also require the X-XSRF-TOKEN header.
    oidcAuthorizationCode:
      type: oauth2
      description: |
        Browser login flow. Use Authorization Code with PKCE. Replace the
        example identity URLs with the configured issuer's discovery metadata.
        The API itself does not expose an /auth/token endpoint.
      flows:
        authorizationCode:
          authorizationUrl: https://identity.example.invalid/oauth2/authorize
          tokenUrl: https://identity.example.invalid/oauth2/token
          scopes:
            openid: Authenticate the user through OpenID Connect
            profile: Read the basic operator profile
            email: Read the operator email claim
            operator:read: Read operator inbox and handoff resources
            handoff:manage: Create and manage handoffs
            operator:write: Send operator messages and update operational resources
            leads:read: Read lead records
            leads:write: Update and synchronize lead records
            inventory:read: Read vehicle inventory
            finance:quote: Calculate finance estimates
            appointments:read: Read available appointment slots
            appointments:write: Book appointments
            bot:manage: Read and update bot configuration
            events:read: Read and stream audit events
            testlab:run: Run development-only scenarios
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous page.
      schema:
        type: string
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    TenantId:
      name: tenantId
      in: query
      required: false
      description: Tenant selected from the authenticated JWT tenant membership.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 240
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong conversation version validator, for example `"v7"`.
      schema:
        type: string
        pattern: '^"?v[0-9]+"?$'
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 120
    MetricFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    MetricTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    MetricTimezone:
      name: timezone
      in: query
      required: false
      schema:
        type: string
        default: UTC
    MetricGroupBy:
      name: groupBy
      in: query
      required: false
      schema:
        type: string
        enum: [day, week, month]
        default: day
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HandoffId:
      name: handoffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LeadId:
      name: leadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Vin:
      name: vin
      in: path
      required: true
      schema:
        type: string
        minLength: 11
        maxLength: 17
    MetaChannel:
      name: channel
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MetaChannel'
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Authenticated identity lacks the required role, scope, or tenant access
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: State conflict or stale version
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UpstreamUnavailable:
      description: Required upstream adapter is not configured or available
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    HealthStatus:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time
    AiRespondRequest:
      type: object
      required: [messages]
      properties:
        conversationId:
          type: string
          format: uuid
          nullable: true
          description: Stable test session ID. History is loaded from server storage.
        tenantId:
          type: string
          format: uuid
          nullable: true
          description: Required only when the validated operator token has multiple tenants.
        containsSensitiveData:
          type: boolean
          default: false
        messages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/AiMessage'
    AiMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, customer, assistant, model, system]
        content:
          type: string
          minLength: 1
          maxLength: 10000
    AiRespondResponse:
      type: object
      required: [conversationId, replyText, suggestedTemperature, handoffSuggested,
                 handoffReason, intent, leadStage, toolFamily, sourceDocumentIds]
      properties:
        conversationId:
          type: string
          format: uuid
        replyText:
          type: string
        suggestedTemperature:
          type: string
          enum: [UNKNOWN, COLD, WARM, HOT]
        handoffSuggested:
          type: boolean
        handoffReason:
          type: string
        intent:
          type: string
        leadStage:
          type: string
        toolFamily:
          type: string
        sourceDocumentIds:
          type: array
          items:
            type: string
    OperatorSession:
      type: object
      required: [operatorId, displayName, email, roles, tenantIds]
      properties:
        operatorId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { type: string, enum: [OPERATOR, MANAGER, ADMIN] }
        tenantIds:
          type: array
          items: { type: string, format: uuid }
    BrowserOperatorSession:
      type: object
      required: [operatorId, displayName, email, roles, tenantIds, hasPasskey]
      properties:
        operatorId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { type: string, enum: [OPERATOR, MANAGER, ADMIN] }
        tenantIds:
          type: array
          items: { type: string, format: uuid }
        hasPasskey:
          type: boolean
    ProblemDetail:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        path:
          type: string
        traceId:
          type: string
    CustomerWindow:
      type: object
      required: [open, channel]
      properties:
        open:
          type: boolean
        lastInboundAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        channel:
          $ref: '#/components/schemas/Channel'
    TemplateMessageCommand:
      type: object
      required: [templateName, language]
      properties:
        templateName:
          type: string
          pattern: '^[a-z0-9_]{1,120}$'
        language:
          type: string
          pattern: '^[a-z]{2}_[A-Z]{2}$'
        parameters:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 1024
    TemplateMessageReceipt:
      type: object
      required: [accepted]
      properties:
        providerMessageId:
          type: string
          nullable: true
        accepted:
          type: boolean
    Channel:
      type: string
      enum: [WHATSAPP, MESSENGER, INSTAGRAM]
    MetaChannel:
      type: string
      enum: [whatsapp, messenger, instagram]
    ConversationState:
      type: string
      enum: [BOT_ACTIVE, LEAD_CAPTURE, HUMAN_PENDING, HUMAN_ACTIVE, CLOSED]
    HandoffStatus:
      type: string
      enum: [HUMAN_PENDING, HUMAN_ACTIVE, CLOSED]
    MessageDirection:
      type: string
      enum: [INBOUND, OUTBOUND]
    DeliveryStatus:
      type: string
