openapi: 3.1.0
info:
  title: Ford AI Operator API
  version: 1.0.0
  description: |
    Contract-first API for the Ford operator application.

    This document contains the canonical `/api/v1` frontend contract and the
    provider-only Meta webhook routes. Operations marked with
    `x-implementation-status: planned` are not available until their backend
    implementation is released.
    Ford-service owns operator authentication and token issuance through Spring
    Authorization Server. Spring Security WebAuthn passkeys are primary;
    Spring one-time-token email login is the recovery path.
  contact:
    name: Ford AI Service
servers:
  - url: https://ford.emme.business
    description: Production public origin
  - url: http://localhost:8080
    description: Local backend origin
x-authentication:
  providerType: spring-authorization-server
  issuer: https://ford.emme.business
  discoveryUrl: https://ford.emme.business/.well-known/openid-configuration
  browserFlow: spring_security_session
  recommendedDeployment: same_origin_spring_proxy
  passkeyPrimary: true
  emailOneTimeTokenFallback: true
  passkeyRelyingParty:
    id: ford.emme.business
    allowedOrigins: [https://ford.emme.business]
  persistence: PostgreSQL_identity_and_redis_session
  browserSessionCookie: SESSION
  protocolEndpoints:
    openidConfiguration: /.well-known/openid-configuration
    jwks: /oauth2/jwks
    authorization: /oauth2/authorize
    token: /oauth2/token
  passkeyEndpoints:
    registrationOptions: /webauthn/register/options
    registration: /webauthn/register
    authenticationOptions: /webauthn/authenticate/options
    authentication: /login/webauthn
  emailOneTimeTokenEndpoints:
    csrf: /api/auth/csrf
    generate: /api/auth/one-time-token
    submit: /login/ott
  requiredJwtClaims:
    - iss
    - aud
    - sub
    - exp
    - nbf
    - roles
    - tenant_id_or_tenant_ids
  roleValues: [OPERATOR, MANAGER, ADMIN]
  currentScopes: [openid, profile, email, 'operator:read', 'operator:write', 'handoff:manage']
  tokenHandling: |
    Spring Security keeps browser authentication in a Redis-backed server
    session and returns only an opaque HttpOnly session cookie. External and
    service clients continue to use validated bearer JWTs. Never put signing
    keys or server credentials in frontend JavaScript.
tags:
  - name: Authentication
  - name: Health
  - name: AI
  - name: Conversations
  - name: Messages
  - name: Handoffs
  - name: Leads
  - name: Vehicles
  - name: Finance
  - name: Appointments
  - name: Advisors
  - name: Metrics
  - name: Bot configuration
  - name: Events
  - name: Test lab
  - name: Meta webhooks
security:
  - bearerAuth: []
  - operatorSessionCookie: []
paths:
  /api/auth/csrf:
    get:
      tags: [Authentication]
      summary: Initialize browser CSRF protection
      operationId: getBrowserCsrfToken
      security: []
      responses:
        '200':
          description: CSRF token and request header name; XSRF-TOKEN cookie is set.
          content:
            application/json:
              schema:
                type: object
                required: [token, headerName]
                properties:
                  token: { type: string }
                  headerName: { type: string, const: X-XSRF-TOKEN }

  /api/auth/one-time-token:
    post:
      tags: [Authentication]
      summary: Request an email one-time-token link
      operationId: requestOperatorOneTimeToken
      description: Returns an enumeration-neutral accepted response for eligible and unknown emails.
      security: []
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Request accepted.
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get the authenticated browser operator
      operationId: getBrowserOperatorSession
      security:
        - operatorSessionCookie: []
      responses:
        '200':
          description: Current enabled operator profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserOperatorSession' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: End the Spring browser session
      operationId: logoutBrowserOperator
      security:
        - operatorSessionCookie: []
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Session invalidated and session cookies cleared.
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/health:
    get:
      tags: [Health]
      summary: Check service availability
      description: Public liveness response. It does not reveal provider secrets or API-key readiness.
      operationId: getHealth
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /api/v1/ai/respond:
    post:
      tags: [AI]
      summary: Generate a display-safe assistant response
      description: Runs the configured assistant and returns display-safe classification and handoff information.
      operationId: respondWithAi
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiRespondRequest'
      responses:
        '200':
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRespondResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /api/v1/operator/me:
    get:
      tags: [Authentication]
      summary: Get the authenticated operator profile
      description: Returns the enabled operator identity and tenant memberships from the backend registry.
      operationId: getCurrentOperatorProfile
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current operator profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/conversations:
    get:
      tags: [Conversations]
      summary: List conversations
      description: Returns conversations visible to the authenticated operator's tenant claims.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/TenantId'
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/ConversationState'
        - name: channel
          in: query
          schema:
            $ref: '#/components/schemas/Channel'
        - name: search
          in: query
          description: Search by participant, phone number, or latest message text.
          schema:
            type: string
            maxLength: 200
        - name: assignedOperatorId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conversation page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Conversations]
      summary: Get a conversation
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Messages]
      summary: List conversation messages
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Message page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Messages]
      summary: Send an operator message
      description: Sends a message through the channel adapter and returns its initial delivery state.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '202':
          description: Message accepted for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conversation is locked by another operator or the provider window is closed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/conversations/{conversationId}/restart:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
    post:
      tags: [Conversations]
      summary: Restart bot context while retaining transcript
      description: Starts a new bot-memory epoch; transcript messages remain available to authorized operators.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New memory epoch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMemoryRestartReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version is stale, a bot turn is active, or the conversation is not bot-owned.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/conversations/runtime-settings:
    get:
      tags: [Conversations]
      summary: Get tenant runtime behavior settings
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Effective settings and audit revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationRuntimeSettingsSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Conversations]
      summary: Update tenant runtime behavior settings
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRuntimeSettings'
      responses:
        '200':
          description: Persisted settings and new audit revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationRuntimeSettingsSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Revision changed since the settings were loaded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/conversations/{conversationId}/takeover:
    post:
      tags: [Handoffs]
      summary: Take over a conversation
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakeoverRequest'
      responses:
        '200':
          description: Active handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/conversations/{conversationId}/handback:
    post:
      tags: [Handoffs]
      summary: Return a conversation to the bot
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '200':
          description: Closed handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/conversations/{conversationId}/window:
    get:
      tags: [Messages]
      summary: Get the Meta customer service window
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Customer service window state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerWindow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/conversations/{conversationId}/hsm:
    post:
      tags: [Messages]
      summary: Send an approved Meta template message
      description: Requires an approved template adapter and returns 503 when template delivery is not configured.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateMessageCommand'
      responses:
        '202':
          description: Template accepted for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateMessageReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /api/v1/handoffs:
    get:
      tags: [Handoffs]
      summary: List handoff tickets
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/HandoffStatus'
      responses:
        '200':
          description: Handoff page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Handoffs]
      summary: Request a human handoff
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoffRequest'
      responses:
        '201':
          description: Handoff created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffTicket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/handoffs/{handoffId}/claim:
    post:
      tags: [Handoffs]
      summary: Claim a pending handoff
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/HandoffId'
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '200':
          description: Claimed handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/handoffs/{handoffId}/pause:
    post:
      tags: [Handoffs]
      summary: Pause bot processing for a handoff
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/HandoffId'
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '200':
          description: Paused handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/handoffs/{handoffId}/resume:
    post:
      tags: [Handoffs]
      summary: Resume bot processing for a handoff
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/HandoffId'
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '200':
          description: Resumed handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/metrics/overview:
    get:
      tags: [Metrics]
      operationId: getMetricsOverview
      summary: Get tenant-scoped operational overview metrics
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/MetricFrom'
        - $ref: '#/components/parameters/MetricTo'
        - $ref: '#/components/parameters/MetricTimezone'
      responses:
        '200':
          description: Operational overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/metrics/bot:
    get:
      tags: [Metrics]
      operationId: getBotMetrics
      summary: Get AI classification and provider metrics
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/MetricFrom'
        - $ref: '#/components/parameters/MetricTo'
        - $ref: '#/components/parameters/MetricTimezone'
      responses:
        '200':
          description: Bot metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BotMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/metrics/leads:
    get:
      tags: [Metrics]
      operationId: getLeadMetrics
      summary: Get lead temperature metrics
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/MetricFrom'
        - $ref: '#/components/parameters/MetricTo'
        - $ref: '#/components/parameters/MetricTimezone'
      responses:
        '200':
          description: Lead metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/metrics/conversations:
    get:
      tags: [Metrics]
      operationId: getConversationMetrics
      summary: Get conversation state metrics
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/MetricFrom'
        - $ref: '#/components/parameters/MetricTo'
      responses:
        '200':
          description: Conversation metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationMetrics' }

  /api/v1/metrics/channels:
    get:
      tags: [Metrics]
      operationId: getChannelMetrics
      summary: Get channel volume metrics
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/MetricFrom'
        - $ref: '#/components/parameters/MetricTo'
      responses:
        '200':
          description: Channel metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelMetrics' }

  /api/v1/metrics/advisors:
    get:
      tags: [Metrics]
      operationId: getAdvisorMetrics
      summary: Get advisor handoff metrics
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/MetricFrom'
        - $ref: '#/components/parameters/MetricTo'
      responses:
        '200':
          description: Advisor metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvisorMetrics' }

  /api/v1/metrics/funnel:
    get:
      tags: [Metrics]
      operationId: getFunnelMetrics
      summary: Get lead funnel metrics
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/MetricFrom'
        - $ref: '#/components/parameters/MetricTo'
      responses:
        '200':
          description: Funnel metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FunnelMetrics' }

  /api/v1/metrics/timeseries:
    get:
      tags: [Metrics]
      operationId: getMetricsTimeSeries
      summary: Get metrics time series
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/MetricFrom'
        - $ref: '#/components/parameters/MetricTo'
        - $ref: '#/components/parameters/MetricTimezone'
        - $ref: '#/components/parameters/MetricGroupBy'
      responses:
        '200':
          description: Metrics time series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeSeriesMetrics' }

  /api/v1/leads:
    get:
      tags: [Leads]
      summary: List leads
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - name: temperature
          in: query
          schema:
            $ref: '#/components/schemas/LeadTemperature'
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
      responses:
