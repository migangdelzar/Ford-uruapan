---
name: Ford Service development deployment

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - development

permissions:
  contents: read

concurrency:
  group: ford-service-dev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: Deploy the local development Compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: development
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Prepare the development environment file
        working-directory: ford-ai-service
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'GRAFANA_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'FORD_OPERATOR_USERNAME=operator\n'
            printf 'FORD_OPERATOR_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'FORD_AI_LOCAL_ENABLED=false\n'
            printf 'FORD_AI_CLOUD_ENABLED=false\n'
            printf 'FORD_AI_CLASSIFICATION_ENABLED=false\n'
            printf 'FORD_META_DELIVERY_ENABLED=false\n'
            printf 'FORD_OUTBOX_ENABLED=false\n'
          } > .env

      - name: Validate the rendered Compose configuration
        working-directory: ford-ai-service
        run: docker compose config --quiet

      - name: Start PostgreSQL, Redis, and the application
        working-directory: ford-ai-service
        run: docker compose up --build -d postgres redis ford-service

      - name: Wait for the application health endpoint
        working-directory: ford-ai-service
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 3 http://localhost:18080/actuator/health >/dev/null; then
              echo 'Ford Service health endpoint is reachable.'
              exit 0
            fi
            sleep 5
          done
          echo 'Ford Service did not become healthy.' >&2
          docker compose logs --no-color --tail 200 >&2 || true
          exit 1

      - name: Verify the health status is UP
        working-directory: ford-ai-service
        run: |
          set -euo pipefail
          status="$(curl -fsS http://localhost:18080/actuator/health \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])')"
          [[ "$status" == 'UP' ]]
          echo "Development deployment healthy: ${status}"

      - name: Publish a bounded deployment summary
        if: always()
        run: |
          {
            echo '### Development deployment'
            echo "- Source: ${GITHUB_SHA}"
            echo '- Stack: local Docker Compose (postgres, redis, ford-service)'
            echo '- Health gate: GET /actuator/health'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down the development stack
        if: always()
        working-directory: ford-ai-service
        run: docker compose down -v
