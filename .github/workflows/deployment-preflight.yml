name: Deployment Connectivity Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-preflight
  cancel-in-progress: false

jobs:
  verify-existing-runtime:
    name: Read-only emme connectivity and health
    runs-on: ubuntu-24.04
    environment: deployment-preflight
    timeout-minutes: 15
    steps:
      - name: Require dispatch from protected main
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo 'Dispatch this read-only preflight from main.' >&2
            exit 1
          }

      - name: Install pinned SSH credentials
        shell: bash
        env:
          APP_SSH_PRIVATE_KEY: ${{ secrets.APP_SSH_PRIVATE_KEY }}
          DATA_SSH_PRIVATE_KEY: ${{ secrets.DATA_SSH_PRIVATE_KEY }}
          APP_SSH_KNOWN_HOSTS: ${{ secrets.APP_SSH_KNOWN_HOSTS }}
          DATA_SSH_KNOWN_HOSTS: ${{ secrets.DATA_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$APP_SSH_PRIVATE_KEY" > "$HOME/.ssh/emme-1"
          printf '%s\n' "$DATA_SSH_PRIVATE_KEY" > "$HOME/.ssh/emme-2"
          printf '%s\n' "$APP_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts-app"
          printf '%s\n' "$DATA_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts-data"
          chmod 0600 "$HOME/.ssh/emme-1" "$HOME/.ssh/emme-2" \
            "$HOME/.ssh/known_hosts-app" "$HOME/.ssh/known_hosts-data"

      - name: Verify Ford Service and collector host health on emme-1
        shell: bash
        env:
          APP_SSH_HOST: ${{ vars.APP_SSH_HOST }}
          SSH_USER: ${{ vars.OCI_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/emme-1" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts-app" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$APP_SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          service_containers="$(docker ps -a --format '{{.Names}} state={{.State}} status={{.Status}} image={{.Image}} ports={{.Ports}}')"
          printf 'Service containers: %s\n' "${service_containers:-none}"
          if python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          routed_healthy = False
          for port in (8080, 18081, 18082):
              endpoint = f"http://127.0.0.1:{port}/actuator/health"
              response = None
              try:
                  response = urllib.request.urlopen(endpoint, timeout=8)
              except urllib.error.HTTPError as error:
                  response = error
              except Exception as error:
                  print(f"Health probe port {port} error: {type(error).__name__}")
                  continue

              code = response.getcode()
              try:
                  payload = json.loads(response.read())
              except (ValueError, OSError):
                  payload = {}
              status = payload.get("status", "UNKNOWN") if isinstance(payload, dict) else "UNKNOWN"
              if status not in ("UP", "DOWN"):
                  status = "UNKNOWN"
              print(f"Health probe port {port}: HTTP {code}, status={status}")
              components = payload.get("components", {}) if isinstance(payload, dict) else {}
              component_statuses = []
              if isinstance(components, dict):
                  for name, component in sorted(components.items()):
                      if not isinstance(name, str) or not isinstance(component, dict):
                          continue
                      component_status = component.get("status", "UNKNOWN")
                      if component_status not in ("UP", "DOWN"):
                          component_status = "UNKNOWN"
                      component_statuses.append(f"{name}={component_status}")
              print(f"Health components port {port}: {', '.join(component_statuses) or 'none'}")
              if port == 8080:
                  routed_healthy = code == 200 and status == "UP"

          raise SystemExit(0 if routed_healthy else 1)
          PY
          then
            health_ok=true
          else
            health_ok=false
          fi
          collector_details="$(docker ps -a --filter 'label=com.docker.compose.service=otel-collector' --format '{{.Names}} {{.State}} {{.Ports}}')"
          port_owners="$(docker ps -a --format '{{.Names}} {{.State}} {{.Ports}}' | awk 'index($0, "13133") > 0 { print }')"
          collector_port_owner_ids="$(docker ps -a --format '{{.ID}} {{.Ports}}' | awk 'index($0, "13133") > 0 { print $1 }')"
          printf 'Collector containers: %s\n' "${collector_details:-none}"
          printf 'Host port 13133 owners: %s\n' "${port_owners:-none}"
          if [[ -n "$collector_port_owner_ids" ]]; then
            for owner_id in $collector_port_owner_ids; do
              docker inspect --format 'port owner={{.Name}} project={{index .Config.Labels "com.docker.compose.project"}} workdir={{index .Config.Labels "com.docker.compose.project.working_dir"}} compose={{index .Config.Labels "com.docker.compose.project.config_files"}} bindings={{json .HostConfig.PortBindings}}' "$owner_id"
            done
          fi
          collector_states="$(docker ps -a --filter 'label=com.docker.compose.service=otel-collector' --format '{{.State}}')"
          [[ "$collector_states" == 'running' ]] || {
            echo 'Expected exactly one running Compose otel-collector service.' >&2
            exit 1
          }
          [[ "$health_ok" == true ]] || {
            echo 'Ford Service health check failed; read-only diagnostics collected.' >&2
            exit 1
          }
          echo 'emme-1 app and collector health passed'
          REMOTE

      - name: Verify PostgreSQL host health on emme-2
        if: always()
        shell: bash
        env:
          DATA_SSH_HOST: ${{ vars.DATA_SSH_HOST }}
          SSH_USER: ${{ vars.OCI_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/emme-2" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts-data" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$DATA_SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          docker exec -u postgres data-postgres-1 pg_isready -U ford -d ford_service >/dev/null
          scheduler_containers="$(docker ps -a --format '{{.Names}} {{.State}}' | awk 'tolower($1) ~ /sched/ { print }')"
          [[ -n "$scheduler_containers" ]] || {
            echo 'No scraper scheduler container was found on emme-2.' >&2
            exit 1
          }
          [[ "$(printf '%s\n' "$scheduler_containers" | wc -l | tr -d ' ')" == '1' \
            && "$scheduler_containers" == *' running' ]] || {
            echo 'Expected exactly one running scraper scheduler on emme-2.' >&2
            exit 1
          }
          scheduler_name="${scheduler_containers%% *}"
          scheduler_workdir="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$scheduler_name")"
          printf 'Existing scheduler container: %s; Compose directory: %s\n' "$scheduler_name" "$scheduler_workdir"
          docker inspect --format 'scheduler project={{index .Config.Labels "com.docker.compose.project"}} service={{index .Config.Labels "com.docker.compose.service"}} compose={{index .Config.Labels "com.docker.compose.project.config_files"}} image={{.Config.Image}} networks={{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' "$scheduler_name"
          legacy_mcp_containers="$(docker ps -a --filter 'label=com.docker.compose.project=ford-mcp' --format '{{.Names}} {{.State}} {{.Image}} {{.Ports}}')"
          legacy_mcp_container_ids="$(docker ps -aq --filter 'label=com.docker.compose.project=ford-mcp')"
          printf 'Legacy MCP project containers: %s\n' "${legacy_mcp_containers:-none}"
          if [[ -n "$legacy_mcp_container_ids" ]]; then
            for mcp_container_id in $legacy_mcp_container_ids; do
              docker inspect --format 'legacy MCP container={{.Name}} project={{index .Config.Labels "com.docker.compose.project"}} service={{index .Config.Labels "com.docker.compose.service"}} compose={{index .Config.Labels "com.docker.compose.project.config_files"}} image={{.Config.Image}} networks={{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}} mounts={{range .Mounts}}{{.Source}}:{{.Destination}} {{end}}' "$mcp_container_id"
            done
          fi
          legacy_mcp_volumes="$(docker volume ls --filter 'label=com.docker.compose.project=ford-mcp' --format '{{.Name}}')"
          printf 'Legacy MCP project volumes: %s\n' "${legacy_mcp_volumes:-none}"
          printf 'emme-2 PostgreSQL is ready; scheduler: %s\n' "$scheduler_containers"
          REMOTE

      - name: Summarize read-only preflight
        if: always()
        run: |
          {
            echo '### Deployment connectivity preflight'
            echo "- Source: $GITHUB_SHA"
            echo '- emme-1 SSH and Ford Service health: checked'
            echo '- emme-2 SSH, PostgreSQL, and exactly-one scheduler check: completed'
            echo '- Legacy MCP container/project/network/mount inventory: completed without mutation'
            echo '- Deployment, migration, image pull, and route switch: not run'
          } >> "$GITHUB_STEP_SUMMARY"
