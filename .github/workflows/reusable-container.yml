---
name: Reusable Container Gates

on:
  workflow_call:
    inputs:
      source_sha:
        description: Full commit SHA to build.
        required: true
        type: string
      version:
        description: Annotated vMAJOR.MINOR.PATCH tag for a published release.
        required: false
        default: ''
        type: string
      publish:
        description: Publish the immutable image.
        required: false
        default: false
        type: boolean
    outputs:
      image:
        description: Immutable GHCR image reference by digest.
        value: ${{ jobs.image.outputs.image }}
      digest:
        description: OCI image content digest.
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

concurrency:
  group: ford-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build, scan, and publish container
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify workflow and container contracts
        run: node --test scripts/workflow-contract.test.mjs
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
      - name: Normalize GHCR repository name
        id: image-repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Prepare image tags
        id: tags
        env:
          IMAGE_REPOSITORY: ${{ steps.image-repository.outputs.name }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          sha_tag="${IMAGE_REPOSITORY}:sha-${SOURCE_SHA}"
          version_tag=''
          plain_version_tag=''
          tags="${sha_tag}"
          if [[ "${PUBLISH}" == 'true' ]]; then
            version_tag="${IMAGE_REPOSITORY}:${VERSION}"
            plain_version_tag="${IMAGE_REPOSITORY}:${VERSION#v}"
            tags+=$'\n'"${version_tag}"$'\n'"${plain_version_tag}"
          fi
          {
            echo "sha_tag=${sha_tag}"
            echo "version_tag=${version_tag}"
            echo "plain_version_tag=${plain_version_tag}"
            echo 'tags<<EOF'
            printf '%s\n' "${tags}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Verify immutable SemVer tag is on main
        if: inputs.publish
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Release version must use vMAJOR.MINOR.PATCH.' >&2
            exit 1
          }
          [[ "$(git cat-file -t "refs/tags/${VERSION}")" == tag ]] || {
            echo 'Release version must be an annotated tag.' >&2
            exit 1
          }
          [[ "$(git rev-parse "refs/tags/${VERSION}^{commit}")" == "${SOURCE_SHA}" ]] || {
            echo 'Release tag target does not match the selected source SHA.' >&2
            exit 1
          }
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${SOURCE_SHA}" refs/remotes/origin/main || {
            echo 'Release tag target is not reachable from main.' >&2
            exit 1
          }
      - name: Build native smoke image
        id: smoke-build
        uses: docker/build-push-action@v6
        with:
          context: ford-ai-service
          file: ford-ai-service/Dockerfile
          tags: ${{ steps.image-repository.outputs.name }}:smoke-${{ inputs.source_sha }}
          platforms: linux/amd64
          load: true
          push: false
          cache-from: type=gha,scope=ford-service
          cache-to: type=gha,scope=ford-service,mode=max
          provenance: false
          sbom: false
      - name: Install PostgreSQL readiness probe
        if: always()
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql-client
      - name: Smoke test Spring service health endpoint
        env:
          IMAGE_NAME: ${{ steps.smoke-build.outputs.imageid }}
        run: |
          set -euo pipefail
          docker network create ford-service-smoke
          docker run --detach --name ford-service-postgres --network ford-service-smoke \
            --env POSTGRES_DB=ford_service --env POSTGRES_USER=ford --env POSTGRES_PASSWORD=ci-smoke \
            pgvector/pgvector:pg16
          until docker exec ford-service-postgres pg_isready -U ford -d ford_service; do sleep 2; done
          docker run --detach --name ford-service-redis --network ford-service-smoke redis:7-alpine
          until docker exec ford-service-redis redis-cli ping | grep --quiet PONG; do sleep 2; done
          docker run --detach --name ford-service-smoke --network ford-service-smoke \
            --env FORD_DATABASE_URL=jdbc:postgresql://ford-service-postgres:5432/ford_service \
            --env FORD_DATABASE_USERNAME=ford --env FORD_DATABASE_PASSWORD=ci-smoke \
            --env FORD_REDIS_HOST=ford-service-redis \
            --env SERVER_PORT=8080 "${IMAGE_NAME}"
          trap 'docker rm --force ford-service-smoke ford-service-postgres ford-service-redis >/dev/null 2>&1 || true; docker network rm ford-service-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if [[ "$(docker inspect --format '{{.State.Running}}' ford-service-smoke)" != true ]]; then
              docker logs ford-service-smoke
              exit 1
            fi
            if docker run --rm --network ford-service-smoke curlimages/curl:8.12.1 \
              --fail --silent http://ford-service-smoke:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker logs ford-service-smoke
          echo 'Ford Service health endpoint did not become healthy.' >&2
          exit 1
      - name: Smoke test Java runtime
        env:
          IMAGE_NAME: ${{ steps.smoke-build.outputs.imageid }}
        run: docker run --rm --entrypoint java "${IMAGE_NAME}" -version
      - name: Build target image for publication
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ford-ai-service
          file: ford-ai-service/Dockerfile
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/arm64
          push: false
          outputs: type=docker,dest=/tmp/ford-service-arm64.tar
          cache-from: type=gha,scope=ford-service
          provenance: false
          sbom: false
      - name: Load target image for scan and publication
        run: docker load --input /tmp/ford-service-arm64.tar
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/ford-service-arm64.tar
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.20.0
        with:
          image: ${{ steps.tags.outputs.sha_tag }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: ford-service-sbom-${{ github.run_id }}.cdx.json
      - name: Log in to GHCR after build, smoke tests, and scan pass
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned image
        id: publish
        if: inputs.publish
        env:
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
          VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
          PLAIN_VERSION_TAG: ${{ steps.tags.outputs.plain_version_tag }}
        run: |
          set -euo pipefail
          if [[ -n "${VERSION_TAG}" ]]; then
            for version_tag in "${VERSION_TAG}" "${PLAIN_VERSION_TAG}"; do
              if docker buildx imagetools inspect "${version_tag}" >/dev/null 2>&1; then
                echo "Version image alias already exists: ${version_tag}" >&2
                exit 1
              fi
            done
          fi
          docker push "${SHA_TAG}" | tee "$RUNNER_TEMP/docker-push.log"
          if [[ -n "${VERSION_TAG}" ]]; then
            docker tag "${SHA_TAG}" "${VERSION_TAG}"
            docker tag "${SHA_TAG}" "${PLAIN_VERSION_TAG}"
            docker push "${VERSION_TAG}"
            docker push "${PLAIN_VERSION_TAG}"
          fi
          digest="$(sed -n 's/^.*digest: \(sha256:[0-9a-f]*\).*$/\1/p' "$RUNNER_TEMP/docker-push.log" | tail -1)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'Could not resolve published image digest.' >&2
            exit 1
          }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Upload container reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ford-container-reports-${{ github.run_id }}
          path: |
            trivy-image.sarif
            sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload image SARIF
        if: >-
          always() && github.event_name != 'pull_request' &&
          (github.event.repository.visibility == 'public' || vars.CODE_SCANNING_ENABLED == 'true') &&
          hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
      - name: Expose image reference
        id: image
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.image-repository.outputs.name }}
          IMAGE_NAME: ${{ steps.tags.outputs.sha_tag }}
        run: |
          if [[ -n "${IMAGE_DIGEST}" ]]; then
            echo "image=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Attest published image
        if: inputs.publish
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image-repository.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Verify published image provenance
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          gh attestation verify "oci://${IMAGE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --source-ref "refs/tags/${VERSION}" \
            --source-digest "${SOURCE_SHA}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/reusable-container.yml"
