---
name: Reusable Container Gates

on:
  workflow_call:
    inputs:
      publish:
        description: Publish the immutable image.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

concurrency:
  group: ford-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build, scan, and publish container
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ford-ai-service
          file: ford-ai-service/Dockerfile
          tags: ${{ env.IMAGE_NAME }}
          platforms: linux/arm64
          load: ${{ !inputs.publish }}
          push: ${{ inputs.publish }}
          provenance: false
          sbom: false
      - name: Pull published image for scanning
        if: inputs.publish
        run: docker pull "${IMAGE_NAME}"
      - name: Expose image reference
        id: image
        run: echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.20.0
        with:
          image: ${{ env.IMAGE_NAME }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: ford-service-sbom-${{ github.run_id }}.cdx.json
      - name: Upload container reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ford-container-reports-${{ github.run_id }}
          path: |
            trivy-image.sarif
            sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload image SARIF
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
      - name: Attest published image
        if: inputs.publish
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
