---
name: Reusable Observability Gates

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ford-observability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate observability stack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive deployment/terraform
      - name: Initialize and validate Terraform
        run: |
          terraform -chdir=deployment/terraform init -backend=false -input=false
          terraform -chdir=deployment/terraform validate
      - name: Run observability contract tests
        run: node --test scripts/observability-contract.test.mjs scripts/operations-contract.test.mjs
      - name: Validate Compose configuration
        env:
          SALT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          NEXTAUTH_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          LANGFUSE_AUTH_HEADER: Basic-test
          POSTGRES_PASSWORD: postgres
          CLICKHOUSE_PASSWORD: clickhouse
          REDIS_AUTH: redis
          MINIO_ROOT_PASSWORD: miniosecret
        run: docker compose -f deployment/observability/langfuse/docker-compose.yml config --quiet
      - name: Validate collector configuration
        env:
          LANGFUSE_OTLP_ENDPOINT: http://langfuse-web:3000/api/public/otel
          LANGFUSE_AUTH_HEADER: Basic-test
        run: >-
          docker run --rm
          -e LANGFUSE_OTLP_ENDPOINT
          -e LANGFUSE_AUTH_HEADER
          -v "$GITHUB_WORKSPACE/deployment/observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro"
          otel/opentelemetry-collector-contrib:0.161.0
          validate --config=/etc/otelcol-contrib/config.yaml
      - name: Validate cloud Tempo and Langfuse collector configuration
        env:
          LANGFUSE_OTLP_ENDPOINT: https://us.cloud.langfuse.com/api/public/otel
          LANGFUSE_PUBLIC_KEY: pk-test
          LANGFUSE_SECRET_KEY: sk-test
        run: >-
          docker run --rm
          -e LANGFUSE_OTLP_ENDPOINT
          -e LANGFUSE_PUBLIC_KEY
          -e LANGFUSE_SECRET_KEY
          -v "$GITHUB_WORKSPACE/deployment/observability/otel-collector/cloud-tempo-config.yaml:/etc/otelcol-contrib/config.yaml:ro"
          otel/opentelemetry-collector-contrib:0.161.0
          validate --config=/etc/otelcol-contrib/config.yaml
