---
name: Reusable Java CI

on:
  workflow_call:
    inputs:
      run_integration:
        description: Run Testcontainers integration tests.
        required: false
        default: true
        type: boolean
      run_ai_evaluation:
        description: Run deterministic AI fixture evaluation.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ford-java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Java quality and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Run quality and unit tests
        working-directory: ford-ai-service
        run: ./gradlew clean check -x integrationTest --no-daemon --no-configuration-cache --stacktrace
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ford-quality-reports-${{ github.run_id }}
          path: |
            ford-ai-service/build/reports/**
            ford-ai-service/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: PostgreSQL integration tests
    if: inputs.run_integration
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Cache BGE-M3 model for Testcontainers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ollama"
          docker run --detach --name ford-ci-bge-ollama \
            --volume "$HOME/.ollama:/root/.ollama" \
            ollama/ollama:0.40.4 serve
          cleanup() { docker rm --force ford-ci-bge-ollama >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if docker exec ford-ci-bge-ollama ollama list >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec ford-ci-bge-ollama ollama list >/dev/null
          docker exec ford-ci-bge-ollama ollama pull bge-m3
      - name: Run integration tests
        working-directory: ford-ai-service
        env:
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
        run: ./gradlew integrationTest --no-daemon --no-configuration-cache --stacktrace
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ford-integration-reports-${{ github.run_id }}
          path: |
            ford-ai-service/build/reports/**
            ford-ai-service/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  evaluation:
    name: Deterministic AI evaluation
    if: inputs.run_ai_evaluation
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Run deterministic AI evaluation
        working-directory: ford-ai-service
        run: ./gradlew test --tests '*AiRegressionEvaluationTest' --no-daemon --no-configuration-cache --stacktrace
      - name: Upload AI evaluation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ford-ai-evaluation-${{ github.run_id }}
          path: ford-ai-service/build/reports/ai-evaluation/**
          if-no-files-found: warn
          retention-days: 30

  summary:
    name: Java CI summary
    if: always()
    needs: [quality, integration, evaluation]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish result summary
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          EVALUATION_RESULT: ${{ needs.evaluation.result }}
        run: |
          set -euo pipefail
          {
            echo "## Ford Service Java CI"
            echo "- Quality: ${QUALITY_RESULT}"
            echo "- Integration: ${INTEGRATION_RESULT}"
            echo "- AI evaluation: ${EVALUATION_RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${QUALITY_RESULT}" != "success" ]]; then
            exit 1
          fi
          if [[ "${INTEGRATION_RESULT}" != "success" && "${INTEGRATION_RESULT}" != "skipped" ]]; then
            exit 1
          fi
          if [[ "${EVALUATION_RESULT}" != "success" && "${EVALUATION_RESULT}" != "skipped" ]]; then
            exit 1
          fi
