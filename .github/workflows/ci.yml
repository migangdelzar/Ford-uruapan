---
name: Ford Service CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ford-service-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java verification
    uses: ./.github/workflows/reusable-java-ci.yml
    with:
      run_integration: true
      run_ai_evaluation: true
    secrets: inherit

  security:
    name: Security gates
    needs: java
    uses: ./.github/workflows/reusable-security.yml
    secrets: inherit
    permissions:
      contents: read
      security-events: write

  observability:
    name: Observability contracts
    needs: java
    uses: ./.github/workflows/reusable-observability.yml
    secrets: inherit
    permissions:
      contents: read

  release-coordinator:
    name: Release coordinator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Test rollout, secret handling, and release scripts
        run: python3 -m unittest discover -s ford-ai-service/scripts/tests -p 'test_*.py' -v

  container:
    name: Container gates (no publication)
    if: github.ref_type != 'tag'
    needs: [java, security, observability, release-coordinator]
    uses: ./.github/workflows/reusable-container.yml
    with:
      source_sha: ${{ github.sha }}
      version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      publish: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
      security-events: write

  publish-container:
    name: Container gates and version publication
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/v')
    needs: [java, security, observability, release-coordinator]
    uses: ./.github/workflows/reusable-container.yml
    with:
      source_sha: ${{ github.sha }}
      version: ${{ github.ref_name }}
      publish: true
    secrets: inherit
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
