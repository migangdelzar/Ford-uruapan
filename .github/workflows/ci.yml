---
name: Ford Service CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_container:
        description: Publish the image from this manually approved run.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ford-service-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java verification
    uses: ./.github/workflows/reusable-java-ci.yml
    with:
      run_integration: true
      run_ai_evaluation: true
    secrets: inherit

  security:
    name: Security gates
    needs: java
    uses: ./.github/workflows/reusable-security.yml
    secrets: inherit
    permissions:
      contents: read
      security-events: write

  observability:
    name: Observability contracts
    needs: java
    uses: ./.github/workflows/reusable-observability.yml
    secrets: inherit
    permissions:
      contents: read

  container:
    name: Container gates
    needs: [java, security, observability]
    uses: ./.github/workflows/reusable-container.yml
    with:
      publish: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_container == true) }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
