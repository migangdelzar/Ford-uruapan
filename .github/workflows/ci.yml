---
name: Ford Service CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ford-service-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java verification
    uses: ./.github/workflows/reusable-java-ci.yml
    with:
      run_integration: true
      run_ai_evaluation: true
    secrets: inherit

  security:
    name: Security gates
    needs: java
    uses: ./.github/workflows/reusable-security.yml
    with:
      require_nvd: false
    secrets: inherit
    permissions:
      contents: read
      security-events: write

  container:
    name: Container gates
    needs: [java, security]
    uses: ./.github/workflows/reusable-container.yml
    with:
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
