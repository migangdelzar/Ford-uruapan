---
name: Ford Service CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      publish_container:
        description: Publish the image from this manually approved run.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ford-service-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java verification
    uses: ./.github/workflows/reusable-java-ci.yml
    with:
      run_integration: true
      run_ai_evaluation: true
    secrets: inherit

  security:
    name: Security gates
    needs: java
    uses: ./.github/workflows/reusable-security.yml
    secrets: inherit
    permissions:
      contents: read
      security-events: write

  observability:
    name: Observability contracts
    needs: java
    uses: ./.github/workflows/reusable-observability.yml
    secrets: inherit
    permissions:
      contents: read

  release-coordinator:
    name: Release coordinator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Test release selection, exact dispatch, and partial outcomes
        working-directory: ford-ai-service
        run: python3 -m unittest scripts.tests.test_release_all_selection scripts.tests.test_release_all_summary -v

  container:
    name: Container gates
    needs: [java, security, observability, release-coordinator]
    uses: ./.github/workflows/reusable-container.yml
    with:
      publish: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_container == true) }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
