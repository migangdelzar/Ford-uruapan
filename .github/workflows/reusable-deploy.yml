name: Reusable Deployment Input Validation

on:
  workflow_call:
    inputs:
      target:
        description: OCI service target.
        required: true
        type: string
      image:
        description: Immutable image digest being considered for deployment.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ford-deployment-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate non-production deployment inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Reject unsupported deployment targets and mutable images
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          DEPLOY_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_TARGET" == "ford-service" || "$DEPLOY_TARGET" == "ford-scraper-scheduler" ]]
          [[ "$DEPLOY_IMAGE" =~ ^ghcr\.io/[A-Za-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          echo "Deployment input contract validated; no environment or deployment credentials were used."
