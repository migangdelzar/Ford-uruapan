name: Monthly Ford catalog sync
run-name: Ford catalog sync (${{ github.event_name }})

on:
  schedule:
    - cron: '17 18 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ford-monthly-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Verify backup and sync catalog on emme-2
    if: github.event_name == 'workflow_dispatch' || vars.FORD_CATALOG_SYNC_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: deployment-preflight
    steps:
      - name: Require protected default branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo 'Catalog sync may run only from main.' >&2
            exit 1
          }

      - name: Check out the protected playbook
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install pinned Ansible runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/catalog-sync-venv"
          "$RUNNER_TEMP/catalog-sync-venv/bin/pip" install --disable-pip-version-check --quiet 'ansible-core==2.21.4'
          mkdir -p "$RUNNER_TEMP/catalog-sync-collections"
          ANSIBLE_COLLECTIONS_PATH="$RUNNER_TEMP/catalog-sync-collections" \
            "$RUNNER_TEMP/catalog-sync-venv/bin/ansible-galaxy" collection install \
            --requirements-file deployment/ansible/requirements.yml

      - name: Install pinned emme-2 SSH credentials
        shell: bash
        env:
          DATA_SSH_PRIVATE_KEY: ${{ secrets.DATA_SSH_PRIVATE_KEY }}
          DATA_SSH_KNOWN_HOSTS: ${{ secrets.DATA_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/catalog-sync-ssh"
          printf '%s\n' "$DATA_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/catalog-sync-ssh/data"
          printf '%s\n' "$DATA_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/catalog-sync-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/catalog-sync-ssh/data" "$RUNNER_TEMP/catalog-sync-ssh/known_hosts"

      - name: Verify backup and run the one-shot sync with Ansible
        id: run_sync
        shell: bash
        env:
          DATA_SSH_HOST: ${{ vars.DATA_SSH_HOST }}
          SSH_USER: ${{ vars.OCI_SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$DATA_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          python3 - "$RUNNER_TEMP/catalog-sync-inventory.json" <<'PY'
          import json
          import os
          import sys

          host = os.environ["DATA_SSH_HOST"]
          user = os.environ["SSH_USER"]
          inventory = {
              "all": {
                  "children": {
                      "data": {
                          "hosts": {
                              "emme-2": {
                                  "ansible_host": host,
                                  "ansible_user": user,
                                  "remote_root": "/opt/ford-uruapan",
                              }
                          }
                      }
                  }
              }
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(inventory, handle)
          PY

          export ANSIBLE_CONFIG="$GITHUB_WORKSPACE/deployment/ansible/ansible.cfg"
          export ANSIBLE_COLLECTIONS_PATH="$RUNNER_TEMP/catalog-sync-collections"
          export ANSIBLE_ROLES_PATH="$GITHUB_WORKSPACE/deployment/ansible/roles"
          export ANSIBLE_HOST_KEY_CHECKING=True
          export ANSIBLE_DISPLAY_ARGS_TO_STDOUT=false
          export ANSIBLE_SSH_ARGS="-o UserKnownHostsFile=$RUNNER_TEMP/catalog-sync-ssh/known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
          "$RUNNER_TEMP/catalog-sync-venv/bin/ansible-playbook" \
            -i "$RUNNER_TEMP/catalog-sync-inventory.json" \
            --private-key "$RUNNER_TEMP/catalog-sync-ssh/data" \
            deployment/ansible/catalog-sync.yml \
            2>&1 | tee "$RUNNER_TEMP/catalog-sync-ansible.log"

          python3 - "$RUNNER_TEMP/catalog-sync-ansible.log" "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          output = Path(sys.argv[1]).read_text(encoding="utf-8")
          matches = re.findall(r"CATALOG_SYNC_RESULT=(\{[^\r\n]*\})", output)
          if not matches:
              raise SystemExit("Ansible completed without the expected bounded sync result.")
          result = json.loads(matches[-1])
          allowed = {
              "backupCreatedAt", "pagesFetched", "pagesChanged", "pagesFailed",
              "usedVehiclesChanged", "offersUpserted", "embeddingsReady", "embeddingFailures",
          }
          if set(result) != allowed:
              raise SystemExit("Ansible returned an unexpected sync result shape.")
          with open(sys.argv[2], "a", encoding="utf-8") as handle:
              handle.write("result=" + json.dumps(result, separators=(",", ":")) + "\n")
          PY

      - name: Remove temporary SSH credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/catalog-sync-ssh"

      - name: Publish bounded workflow summary
        if: always()
        shell: bash
        env:
          SYNC_OUTCOME: ${{ steps.run_sync.outcome }}
          SYNC_RESULT: ${{ steps.run_sync.outputs.result }}
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" "$SYNC_OUTCOME" "$SYNC_RESULT" <<'PY'
          import json
          import sys
          from pathlib import Path

          summary_path, outcome, raw = sys.argv[1:]
          lines = ["### Monthly Ford catalog sync", f"- Result: {outcome or 'not run'}"]
          if outcome == "success" and raw:
              result = json.loads(raw)
              lines.extend([
                  f"- Verified backup (UTC): `{result['backupCreatedAt']}`",
                  f"- Pages fetched / changed / failed: {result['pagesFetched']} / {result['pagesChanged']} / {result['pagesFailed']}",
                  f"- Used vehicles changed: {result['usedVehiclesChanged']}",
                  f"- Financing offers upserted: {result['offersUpserted']}",
                  f"- Embeddings ready / failed: {result['embeddingsReady']} / {result['embeddingFailures']}",
              ])
          else:
              lines.append("- Sync summary withheld because backup validation or sync failed.")
          with open(summary_path, "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
